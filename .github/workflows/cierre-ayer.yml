name: Cierre de ayer (SUNAT)

# El BCRP publica el cierre del dólar con un día hábil de retraso; SUNAT lo publica de madrugada.
# Si SUNAT ya tiene un cierre que falta en la serie, se añade como dato provisional y el motor vuelve a
# correr: el rango del día parte del cierre de ayer y queda más angosto con la misma cobertura.

on:
  schedule:
    - cron: "37 8 * * 1-6"    # 03:37 en Lima: SUNAT publica el cierre del día hábil anterior hacia las 02:20
    - cron: "7 10 * * 1-6"    # respaldo 05:07, antes del boletín
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: official-data
  cancel-in-progress: false

jobs:
  cierre:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Con --referencia deja ENGINE_HOY para que el motor conserve las fechas objetivo de la corrida anterior.
      - id: cierre
        run: node scripts/cierre-sunat.js --referencia
      - name: Cierre de la 1:30 p. m. (provisional, prensa)
        continue-on-error: true
        run: node scripts/cierre-1330.js
      - name: PerData Engine diario
        if: steps.cierre.outputs.aplicado == 'true'
        run: node scripts/engine-daily.js
      - name: Evaluar aciertos del dólar (pronósticos publicados)
        if: steps.cierre.outputs.aplicado == 'true'
        run: node scripts/aciertos-dolar.js
      - name: Generar página de dólar estática
        if: steps.cierre.outputs.aplicado == 'true'
        run: node scripts/build-dolar-html.js
      - name: Guardar si hay cambios
        run: |
          git config user.name "perdata-bot"
          git config user.email "perdata-bot@users.noreply.github.com"
          git add data/official/bcrp-daily.json data/daily-forecasts.json data/official/pronosticos-dolar.json data/official/aciertos-dolar.json dolar.html data/official/cierre-visto.json data/official/cierre-1330.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data(official): cierre de ayer $(date -u +%F)"
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && break
              [ "$i" -eq 4 ] && exit 1
              sleep $((i*5))
            done
          fi
      - name: Publicar el sitio con el cierre nuevo
        if: steps.cierre.outputs.aplicado == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main