name: Datos oficiales (BCRP, EIA, Banco Mundial, SUNAT, Reserva Federal)

on:
  schedule:
    - cron: "47 22 * * 1-5"   # 17:47 en Lima, días hábiles
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1 openpyxl==3.1.5
      - name: Descargar datos oficiales
        run: python scripts/fetch_official.py
      - name: Descargar índices EPU
        run: python scripts/fetch_epu.py
      - name: Guardar si hay cambios
        if: always()
        run: |
          git config user.name "perdata-bot"
          git config user.email "perdata-bot@users.noreply.github.com"
          git add data/official/*.json
          git diff --cached --quiet || (git commit -m "data(official): $(date -u +%F)" && git pull --rebase -q && git push)
