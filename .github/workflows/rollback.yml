name: Volver a la versión anterior del Worker

# Vuelve el Worker de Cloudflare a la versión anterior. Lo dispara el vigía (scripts/vigia.mjs)
# con `gh workflow run rollback.yml -f motivo=<código>`, o una persona a mano. Usa el mismo
# grupo de concurrencia que deploy.yml para no pisar un despliegue en curso.
on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo del retroceso (opcional, queda en el registro de Cloudflare)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar el token de Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Falta el secreto CLOUDFLARE_API_TOKEN: no se puede volver atrás" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Volver a la versión anterior del Worker
        id: rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5d726da093600803a41d55dc07b17562
          MOTIVO: ${{ inputs.motivo }}
        run: |
          npx wrangler rollback --message "vigia: $MOTIVO" --yes
      - name: Esperar a que producción se propague
        run: sleep 20
      - name: Smoke test en producción
        id: smoke
        run: node scripts/smoke.js --base https://perdata.site
      - name: Resumen
        if: always()
        env:
          MOTIVO: ${{ inputs.motivo }}
          RESULTADO_ROLLBACK: ${{ steps.rollback.outcome }}
          RESULTADO_SMOKE: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Volver a la versión anterior del Worker"
            echo ""
            echo "- Motivo: ${MOTIVO:-(sin motivo)}"
            echo "- Rollback: $RESULTADO_ROLLBACK"
            echo "- Smoke de producción: $RESULTADO_SMOKE"
          } >> "$GITHUB_STEP_SUMMARY"
