name: Cotizaciones de Lima (SMV)

# Daily closes of every Lima stock from the SMV public registry into Supabase
# (scripts/fetch-smv-precios.js), before the daily model run so it sees today's closes.
# ~200 securities, one request every 3 s: about 20 minutes.
on:
  schedule:
    - cron: "23 1 * * 2-6"   # 20:23 en Lima, de lunes a viernes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smv-precios
  cancel-in-progress: false

jobs:
  cotizaciones:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cierres de los últimos dos meses
        run: node scripts/fetch-smv-precios.js
      - name: Calcular estado de los emisores
        run: node scripts/build-empresas-estado.js
      - name: Fichas de empresa (texto con datos SMV; solo las ricas son indexables)
        run: node scripts/build-empresas-html.js
      - name: Rangos semanales y mensuales de acciones
        run: node scripts/engine-acciones.js
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Guardar el estado actualizado
        run: |
          git config user.name "perdata-bot"
          git config user.email "perdata-bot@users.noreply.github.com"
          git add data/empresas-estado.json empresas.html empresa
          if [ -f data/acciones-rangos.json ]; then git add data/acciones-rangos.json; fi
          git diff --cached --quiet || (
            git commit -m "data(smv): estado de emisores $(date -u +%F)" &&
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && break
              [ "$i" -eq 4 ] && exit 1
              sleep $((i*5))
            done
          )
