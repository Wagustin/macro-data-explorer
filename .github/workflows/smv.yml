name: Hechos de importancia (SMV)

on:
  schedule:
    - cron: "23 1 * * *"    # 20:23 en Lima
    - cron: "53 5 * * *"    # 00:53 en Lima, recoge lo publicado tarde
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smv
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leer la página del día de la SMV
        run: node scripts/fetch-smv.js
      - name: Descargar accionistas de datos abiertos
        run: node scripts/fetch-smv-open.js
      - name: Enlazar emisores con su RUC
        run: node scripts/build-empresas-ruc.js
      - name: Guardar si hay hechos nuevos
        run: |
          git config user.name "perdata-bot"
          git config user.email "perdata-bot@users.noreply.github.com"
          git add data/smv-hechos.json
          git add data/smv-accionistas.json data/empresas-ruc.json
          git diff --cached --quiet || (
            git commit -m "data(smv): hechos de importancia $(date -u +%F)" &&
            for i in 1 2 3 4; do
              git pull --rebase -q origin main && git push -q origin HEAD:main && break
              [ "$i" -eq 4 ] && exit 1
              sleep $((i*5))
            done
          )
