name: Proyecciones diarias (PerData Engine)

# Replaces the cron on the home server: refreshes the monthly history, runs Chronos-2 on CPU,
# blends it with Engine v3 (PerData Engine v5) and upserts the forecasts into Supabase. Needs the repository secrets SUPABASE_URL and
# SUPABASE_SERVICE_KEY; until they exist the job stops at the first step without doing anything.
on:
  schedule:
    - cron: "7 11 * * *"   # 06:07 en Lima
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timesfm
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
    steps:
      - name: Comprobar secretos
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL y SUPABASE_SERVICE_KEY"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Caché del modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chronos-2
      - name: Instalar Chronos-2 (CPU)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install "chronos-forecasting>=2.0" numpy
      - name: Actualizar el historial mensual
        run: node scripts/refresh-history.js
      - name: Chronos-2 a 48 meses para todos los activos
        run: python scripts/chronos_batch.py
      - name: PerData Engine v5 (Chronos-2 + v3), 1 a 48 meses, a Supabase
        run: node scripts/precompute-engine.js
      - name: Nota del día por activo (IA)
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/interpretations.js
      - name: Guardar las notas
        run: |
          git config user.name "perdata-bot"
          git config user.email "perdata-bot@users.noreply.github.com"
          git add data/interpretaciones.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "data(notas): notas del día $(date -u +%F)" && git pull --rebase -q && git push)
