name: Visual check

on:
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Name for this set of screenshots"
        required: true
        default: "manual"
        type: string
      tema:
        description: "Color theme for page captures"
        required: true
        default: "claro"
        type: choice
        options:
          - claro
          - oscuro
      comparar_con:
        description: "Earlier workflow run id to compare against"
        required: false
        type: string
      base_url:
        description: "Base URL for page captures and checks"
        required: false
        default: "https://perdata.site"
        type: string

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install browser and image comparison packages
        run: |
          npm i --no-save --package-lock=false playwright pixelmatch@5 pngjs
          npx playwright install --with-deps chromium
      - name: Capture current pages
        id: capture
        continue-on-error: true
        run: node scripts/visual-capture.js
        env:
          BASE_URL: ${{ inputs.base_url || 'https://perdata.site' }}
          TEMA: ${{ inputs.tema || 'claro' }}
      - name: Download previous screenshots
        if: inputs.comparar_con != ''
        uses: actions/download-artifact@v4
        with:
          pattern: visual-*
          path: visual-baseline
          merge-multiple: true
          run-id: ${{ inputs.comparar_con }}
          github-token: ${{ github.token }}
      - name: Compare screenshots
        if: inputs.comparar_con != ''
        run: node scripts/visual-diff.js visual-baseline visual-current
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-${{ inputs.etiqueta }}
          path: visual-current
          if-no-files-found: error
      - name: Fail after uploading captures
        if: steps.capture.outcome == 'failure'
        run: exit 1
