<!DOCTYPE html>
<html lang="es-PE" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Entrar — PerData</title>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Early Theme Init to prevent flash of unstyled content -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (savedTheme === "dark" || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
        document.documentElement.classList.remove("light");
      } else {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
      }
    })();
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">

  <link rel="stylesheet" href="/pd.css" />
  <script src="/auth.js" defer></script>
  <script src="/pd-login-field.js" defer></script>
  <script src="/entrar.js" defer></script>
</head>
<body class="pd-entrar-page">
  <div class="pd-entrar-layout">
    <!-- Izquierda: panel tinta #141311 a toda altura con el campo de pd-login-field.js -->
    <section class="pd-entrar-field-col" aria-label="Calibración PerData Engine">
      <canvas id="pdAuthCanvas" class="pd-auth-canvas" aria-hidden="true"></canvas>
      <div class="pd-entrar-art-header">
        <a href="/" class="pd-wordmark" aria-label="PerData">PerData<span class="pd-flag" role="img" aria-label="Perú"><b></b><b></b><b></b></span></a>
      </div>
      <div class="pd-entrar-art-footer">
        <div class="pd-entrar-art-quote">El rango probable, no una promesa.</div>
        <div class="pd-entrar-art-sub">CALIBRACIÓN P10–P90 · PERDATA ENGINE v6</div>
      </div>
    </section>

    <!-- Derecha: papel #F5F1E8, formulario centrado de 400 px máx. -->
    <main class="pd-entrar-form-col">
      <div class="pd-entrar-topbar">
        <a id="pdVolverLink" href="/" class="pd-entrar-back" aria-label="Volver">← Volver</a>
      </div>

      <div class="pd-entrar-form-center">
        <div class="pd-entrar-mobile-brand">
          <a href="/" class="pd-wordmark" aria-label="PerData">PerData<span class="pd-flag" role="img" aria-label="Perú"><b></b><b></b><b></b></span></a>
        </div>

        <h1 id="pdAuthTitle" class="pd-entrar-title">Inicia sesión en PerData</h1>
        <p id="pdAuthPrompt" class="pd-dialog-prompt" hidden></p>

        <div id="pdAuthTabs" class="pd-tabs" role="tablist" aria-label="Modo de autenticación">
          <button id="pdTabSignIn" type="button" role="tab" aria-selected="true">Iniciar sesión</button>
          <button id="pdTabSignUp" type="button" role="tab" aria-selected="false">Crear cuenta</button>
        </div>

        <div id="pdGoogleWrap" hidden>
          <a id="pdGoogleBtn" class="pd-btn pd-btn-ghost pd-btn-block" href="/api/auth?action=google">
            <svg class="pd-btn-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
            <span>Continuar con Google</span>
          </a>
          <p class="pd-auth-or"><span>o con tu correo</span></p>
        </div>

        <form id="pdAuthForm" class="pd-form" novalidate>
          <label id="pdGroupName" class="pd-field" hidden>
            <span>Nombre</span>
            <input id="pdAuthName" type="text" autocomplete="name" maxlength="80" placeholder="Cómo te llamamos">
          </label>

          <label class="pd-field">
            <span>Correo electrónico</span>
            <input id="pdAuthEmail" type="email" autocomplete="email" required placeholder="tu@empresa.com">
          </label>

          <label id="pdGroupPassword" class="pd-field">
            <span>Contraseña</span>
            <span class="pd-field-pw">
              <input id="pdAuthPassword" type="password" autocomplete="current-password" required placeholder="Tu contraseña">
              <button type="button" id="pdTogglePw" aria-label="Mostrar contraseña">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </span>
          </label>

          <div id="pdForgot" class="pd-form-aside">
            <a href="/entrar?modo=recuperar" id="pdForgotBtn">¿Olvidaste tu contraseña?</a>
          </div>

          <p id="pdAuthStatus" class="pd-form-status" role="status" aria-live="polite"></p>

          <button id="pdAuthSubmit" type="submit" class="pd-btn pd-btn-primary pd-btn-block">Iniciar sesión</button>

          <p id="pdAuthLegal" class="pd-form-legal" hidden>Al crear tu cuenta aceptas los <a href="/terms">Términos y Condiciones</a>.</p>

          <div id="pdBackToLogin" class="pd-form-aside" hidden>
            <a id="pdBackToLoginBtn" href="/entrar">← Volver a iniciar sesión</a>
          </div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
