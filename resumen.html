<!doctype html>
<html lang="es-PE" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resumen del día · PerData</title>
  <meta name="description" content="Resumen diario de economía y mercados del Perú, elaborado a partir de titulares públicos.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/pd.css">
  <style>
    .digest-shell { width: min(100% - 40px, 760px); margin: 0 auto; padding: 64px 0 88px; }
    .digest-kicker { color: var(--pd-ink-soft); font: 500 11px var(--pd-font-mono, monospace); letter-spacing: .08em; text-transform: uppercase; }
    .digest-title { margin: 12px 0 8px; font: 600 clamp(34px, 7vw, 54px)/1.08 var(--pd-font-read, Georgia, serif); letter-spacing: -.035em; }
    .digest-date { color: var(--pd-ink-soft); font: 13px var(--pd-font-mono, monospace); font-variant-numeric: tabular-nums; }
    .digest-story { padding: 27px 0; border-top: 1px solid var(--pd-rule); }
    .digest-story h2 { margin: 0 0 8px; font: 600 24px/1.25 var(--pd-font-read, Georgia, serif); }
    .digest-story p { margin: 0; font: 17px/1.65 var(--pd-font-read, Georgia, serif); }
    .digest-sources { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 13px; font: 12px var(--pd-font-ui, sans-serif); }
    .digest-sources a, .digest-index a { color: var(--pd-ink-soft); text-underline-offset: 3px; }
    .digest-sources a:hover, .digest-index a:hover { color: var(--pd-ink); }
    .digest-notice { border-top: 1px solid var(--pd-rule); padding-top: 20px; color: var(--pd-ink-soft); font-size: 13px; line-height: 1.6; }
    .digest-index { list-style: none; padding: 0; margin: 26px 0; border-top: 1px solid var(--pd-rule); }
    .digest-index li { padding: 15px 0; border-bottom: 1px solid var(--pd-rule); font: 16px var(--pd-font-read, Georgia, serif); }
    @media (max-width: 600px) { .digest-shell { width: min(100% - 32px, 760px); padding-top: 42px; } }
  </style>
  <link rel="stylesheet" href="/tw.css" />
</head>
<body class="bg-paper text-ink">
  <main class="pd-data-main digest-shell">
    <a href="/resumenes" id="backLink" class="digest-kicker" hidden>Archivo de resúmenes</a>
    <p class="digest-kicker" id="eyebrow">PerData · Economía y mercados</p>
    <h1 class="digest-title" id="pageTitle">Resumen del día</h1>
    <p class="digest-date" id="pageDate"></p>
    <section id="stories" aria-live="polite"></section>
    <ul class="digest-index" id="days" hidden></ul>
    <p class="digest-notice" id="notice">Notas redactadas por PerData Engine con ayuda de IA a partir de titulares públicos.</p>
  </main>
  <footer class="border-t border-rule bg-card py-8 px-4">
    <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-between gap-4 text-xs text-ink-soft">
      <a href="/" class="pd-wordmark no-underline">PerData<span class="pd-flag" aria-hidden="true"><b></b><b></b><b></b></span></a>
      <nav class="flex flex-wrap gap-5" aria-label="Navegación secundaria">
        <a href="/noticias">Noticias</a><a href="/resumenes">Archivo de resúmenes</a><a href="/mercado">Mercado</a><a href="/estado">Estado</a><a href="/privacidad">Privacidad</a>
      </nav>
    </div>
  </footer>
  <script>
    const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const path = location.pathname.replace(/\/$/, "");
    const archive = path === "/resumenes";
    const dateMatch = /^\/resumen\/(\d{4}-\d{2}-\d{2})$/.exec(path);
    const title = document.getElementById("pageTitle");
    const dateLabel = (date) => {
      const [year, month, day] = date.split("-").map(Number);
      return new Intl.DateTimeFormat("es-PE", { timeZone: "UTC", day: "numeric", month: "long", year: "numeric" }).format(new Date(Date.UTC(year, month - 1, day)));
    };
    async function load() {
      if (archive) {
        title.textContent = "Archivo de resúmenes";
        document.getElementById("eyebrow").textContent = "PerData · Archivo";
        document.getElementById("pageDate").textContent = "Ediciones diarias";
        document.getElementById("notice").hidden = true;
        const response = await fetch("/data/resumenes/index.json");
        if (!response.ok) throw new Error("archive");
        const data = await response.json();
        const list = document.getElementById("days");
        list.hidden = false;
        list.innerHTML = (data.fechas || []).map((date) => `<li><a href="/resumen/${escapeHTML(date)}">Resumen del día, ${escapeHTML(dateLabel(date))}</a></li>`).join("") || "<li>No hay resúmenes publicados.</li>";
        return;
      }
      if (!dateMatch) throw new Error("missing");
      const date = dateMatch[1];
      title.textContent = `Resumen del día, ${dateLabel(date)}`;
      document.getElementById("pageDate").textContent = date;
      document.getElementById("backLink").hidden = false;
      const response = await fetch(`/data/resumenes/${date}.json`);
      if (!response.ok) throw new Error("missing");
      const data = await response.json();
      document.getElementById("stories").innerHTML = (data.historias || []).map((story) => {
        const sources = (story.fuentes || []).map((source) => {
          const url = /^https?:\/\//i.test(source.url || "") ? source.url : "#";
          return `<a href="${escapeHTML(url)}" target="_blank" rel="noopener nofollow">${escapeHTML(source.titulo || source.fuente || "Fuente")}</a>`;
        }).join("");
        return `<article class="digest-story"><h2>${escapeHTML(story.titulo)}</h2><p>${escapeHTML(story.nota)}</p><div class="digest-sources">${sources}</div></article>`;
      }).join("");
      document.getElementById("notice").textContent = "Notas redactadas por PerData Engine con ayuda de IA a partir de titulares públicos.";
    }
    load().catch(() => {
      title.textContent = "Resumen no disponible";
      document.getElementById("stories").textContent = "No encontramos esta edición.";
      document.getElementById("days").hidden = true;
    });
  </script>
</body>
</html>
